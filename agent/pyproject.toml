[project]
name = "codebase-pr-api"
version = "0.1.0"
description = "A REST API that uses the Codebase agent to create PRs from tickets"
requires-python = ">=3.10"
dependencies = [
  "codegen>=0.48.4",
  "fastapi>=0.115.8",
  "uvicorn>=0.27.0",
  "pydantic>=2.10.6",
  "python-dotenv>=1.0.0",
  "asyncpg>=0.29.0",
  "pytz>=2024.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data", "helpers"]
