[project]
name = "wallie"
version = "0.1.0"
description = "AI Agent to plan and code your projects"
requires-python = ">=3.12, <3.14"
dependencies = [
  "codegen==0.52.19",
  "fastapi>=0.115.8",
  "uvicorn>=0.27.0",
  "pydantic>=2.10.6",
  "python-dotenv>=1.0.0",
  "asyncpg>=0.29.0",
  "pytz>=2024.1",
  "pyjwt>=2.10.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data"]
