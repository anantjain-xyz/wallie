name: "wallie"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 54321:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical

  backend:
    image: electricsql/electric
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/wallie?sslmode=disable
      ELECTRIC_SECRET: development-electric-secret
    ports:
      - 3000:3000
    depends_on:
      - postgres

volumes:
  postgres_data:
